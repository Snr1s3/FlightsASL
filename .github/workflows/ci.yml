name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.4
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Refresh lock file
        run: poetry lock

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Validate project metadata
        run: poetry check

      - name: Lint (Ruff)
        run: poetry run ruff check src

      - name: Byte-compile sources
        run: poetry run python -m compileall src
  build:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload a new image to docker
        uses: Snr1s3/upload-to-docker-action@1.0.2
        with:
          docker_username: ${{ secrets.DOCKERHUB_USERNAME }}
          docker_token: ${{ secrets.DOCKERHUB_TOKEN }}
          docker_tags: snr1s3/flightsasl:latest
          docker_platforms: linux/amd64,linux/arm64
          docker_file: ./src/Dockerfile
