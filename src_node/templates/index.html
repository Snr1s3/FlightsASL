<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlightsASL</title>
    <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
    <main class="page-shell">
        {% include "topbar.html" %}

        <div class="card">
            <p id="api-response">Type an airport name to get started.</p>

            <div class="search-bar">
                <input id="search-input" type="text" placeholder="e.g. Barcelona, JFK, Heathrow..." autocomplete="off" />
                <button id="search-btn" title="Search">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                    fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                </button>
            </div>

            <div id="search-results">
                <p class="airport-coords">Empty List</p> 
            </div>
        </div>
    </main>
    <script>
        const search_input = document.getElementById('search-input');
        const search_btn = document.getElementById('search-btn');
        const results = document.getElementById('search-results');

        let currentAirports = [];

        search_input.addEventListener('keydown', e => {
        if (e.key === 'Enter') search();
        });

        search_btn.addEventListener('click', () => search());

        results.addEventListener('click', async e => {
        const button = e.target.closest('.airport-btn');
        if (!button) return;

        const index = Number(button.dataset.index);
        const airport = currentAirports[index];

        const res = await fetch('/api/airport/save', {
            method: 'POST',
            headers: {
            'Content-Type': 'application/json'
            },
            body: JSON.stringify(airport)
        });

        const data = await res.json();
        console.log(data);
        });

        async function search() {
        const name = search_input.value.trim();
        if (!name) return;

        const res = await fetch('/api/airport/search', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ name })
        });
        const airports = await res.json();

        currentAirports = airports;

        results.innerHTML = airports.map((a, index) => `
            <div class="airport-item">
            <div class="airport-meta">
                <p class="airport-name">${a.name} - ${a.iata} / ${a.icao}</p>
                <p class="airport-coords">${a.lat} / ${a.lon}</p>
            </div>
            <button class="airport-btn" data-index="${index}">Save</button>
            </div>
        `).join('');
        }
    </script>
</body>
</html>
